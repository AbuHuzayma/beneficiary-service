apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: beneficiary-service
  description: Manages beneficiary details and validation (.NET 8)
  tags:
    - dotnet8
    - csharp
    - MSSQL
  labels:
    criticality: tier-1
  annotations:
    hosting/cluster: "OpenShift"
    database/name: "BeneficiaryEngineDb"
    database/type: "MSSQL"
    database/host: "pg-prod-east.database.com"
spec:
  type: service
  lifecycle: production
  owner: group:default/backend-team
  providesApis:
    - api:default/beneficiary-service

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: beneficiary-service
  description: OpenAPI specification for Beneficiary Service
  tags:
    - dotnet8
    - csharp
    - MSSQL
  labels:
    criticality: tier-1
  annotations:
    hosting/cluster: "OpenShift"
    database/name: "BeneficiaryEngineDb"
    database/type: "MSSQL"
    database/host: "pg-prod-east.database.com"
spec:
  type: openapi
  lifecycle: production
  owner: group:default/backend-team
  definition: |
    openapi: 3.0.0
    info:
      title: Beneficiary Service API
      version: 1.0.0
    paths:
      /api/v1/beneficiaries:
        get:
          summary: Get beneficiary list
          responses:
            '200':
              description: OK
