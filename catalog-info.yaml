apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: beneficiary-service
  description: Manages beneficiary details and validation (.NET 8)
  tags:
    - dotnet8
    - csharp
    - mssql
  labels:
    criticality: tier-1
    environment: production
  annotations:
    hosting/cluster: "OpenShift"
    database/name: "BeneficiaryEngineDb"
    database/type: "MSSQL"
    database/host: "sql-prod-east.database.com"  # Corrected hostname convention
spec:
  type: service
  lifecycle: production
  owner: group:default/backend-team
  providesApis:
    - api:default/beneficiary-service
  dependsOn:
    - resource:default/beneficiary-service-db

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: beneficiary-service
  description: OpenAPI specification for Beneficiary Service
spec:
  type: openapi
  lifecycle: production
  owner: group:default/backend-team
  definition: |
    openapi: 3.0.0
    info:
      title: Beneficiary Service API
      version: 1.0.0
    paths:
      /api/v1/beneficiaries:
        get:
          summary: Get beneficiary list
          responses:
            '200':
              description: OK

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: beneficiary-service-db
  description: MSSQL Database for Beneficiary Service
  tags:
    - mssql
spec:
  type: database
  owner: group:default/backend-team
